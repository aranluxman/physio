name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race each other; the newest push wins.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test the scheduling engine
        run: npm test

      - name: Build the static site
        # NEXT_PUBLIC_* values are inlined into the bundle at build time, so
        # they have to be present here rather than at runtime.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::Missing NEXT_PUBLIC_SUPABASE_URL. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ] && [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing the Supabase key. Add NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY (sb_publishable_...) under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          npm run build

      # Create the Pages project on first run. This used to be
      # continue-on-error, which swallowed a real failure: `physio-tracker` was
      # already taken by a stranger's site (pages.dev names are unique across
      # all of Cloudflare), the create silently failed, and the deploy went
      # nowhere. Now only "already exists" is tolerated; anything else stops
      # the run with the reason printed.
      - name: Create the Pages project if it does not exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'aran-physio' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID. Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          set +e
          out=$(npx --yes wrangler@3 pages project create "$PROJECT_NAME" --production-branch=main 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ $code -eq 0 ]; then
            echo "Created Pages project $PROJECT_NAME."
          elif echo "$out" | grep -qiE "already (exists|in use)"; then
            echo "Pages project $PROJECT_NAME already exists — nothing to do."
          else
            echo "::error::Could not create or reach the Pages project '$PROJECT_NAME'. If the name is taken by another Cloudflare account, set a different one in the CLOUDFLARE_PROJECT_NAME repository variable."
            exit $code
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Set CLOUDFLARE_PROJECT_NAME as a repository *variable* to override
          # the default (Settings -> Secrets and variables -> Actions -> Variables).
          command: >-
            pages deploy out
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'aran-physio' }}
            --branch=main
